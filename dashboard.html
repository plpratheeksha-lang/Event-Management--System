<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
}

nav {
    background: #2563eb;
    color: white;
    padding: 18px 40px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 40px auto;
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
}


/* Statistics */

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin-bottom: 40px;
}

.stat {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.1);

}

.stat h3 {
    color: #555;
    margin-bottom: 10px;
}

.number {

    font-size: 36px;

    font-weight: bold;

    color: #2563eb;

}


/* Registration */

.registration {

    background: white;

    padding: 20px;

    margin-bottom: 15px;

    border-radius: 12px;

    box-shadow:
        0 4px 12px rgba(0,0,0,.08);

}

.registration h3 {

    color: #2563eb;

    margin-bottom: 12px;

}

.registration p {

    margin: 7px 0;

    color: #444;

}

.event {

    display: inline-block;

    background: #dbeafe;

    color: #1d4ed8;

    padding: 7px 10px;

    border-radius: 6px;

    font-weight: bold;

    margin-bottom: 12px;

}

.cancel {

    margin-top: 12px;

    padding: 9px 15px;

    background: #dc2626;

    color: white;

    border: none;

    border-radius: 6px;

    cursor: pointer;

}

.no-data {

    background: white;

    padding: 25px;

    border-radius: 12px;

    color: #666;

}


/* Mobile */

@media(max-width:800px) {

    .stats {

        grid-template-columns: 1fr;

    }

    nav {

        flex-direction: column;

        gap: 15px;

    }

}

</style>

</head>


<body>


<nav>

<h2>🎉 Event Management</h2>

<div>

<a href="index.html">Home</a>

<a href="events.html">Events</a>

<a href="dashboard.html">Dashboard</a>

</div>

</nav>


<div class="container">

<h1>📊 Dashboard</h1>

<p class="subtitle">
Event registration details
</p>


<!-- Statistics -->

<div class="stats">

<div class="stat">

<h3>📅 Upcoming Events</h3>

<div class="number">
6
</div>

</div>


<div class="stat">

<h3>📝 Total Registrations</h3>

<div class="number"
id="total">
0
</div>

</div>


<div class="stat">

<h3>👥 Registered Students</h3>

<div class="number"
id="students">
0
</div>

</div>

</div>


<h2>📝 Registration List</h2>

<br>

<div id="registrationList"></div>

</div>


<script>


function displayRegistrations() {


    // Read SAME key used by register.html

    let registrations =
        JSON.parse(
            localStorage.getItem("registrations")
        ) || [];


    // Show total

    document.getElementById("total")
        .textContent =
        registrations.length;


    // Show student count

    document.getElementById("students")
        .textContent =
        registrations.length;


    let list =
        document.getElementById(
            "registrationList"
        );


    // If nothing registered

    if (registrations.length === 0) {

        list.innerHTML = `

            <div class="no-data">

                No registrations found.

                <br><br>

                Go to
                <b>Events</b>
                and register for an event.

            </div>

        `;

        return;
    }


    list.innerHTML = "";


    // Display every person

    registrations.forEach(
        function(registration, index) {


            list.innerHTML += `

                <div class="registration">

                    <div class="event">
                        🎓 ${registration.event}
                    </div>

                    <h3>
                        👤 ${registration.name}
                    </h3>

                    <p>
                        📱 Phone:
                        ${registration.phone}
                    </p>

                    <p>
                        📧 Email:
                        ${registration.email}
                    </p>

                    <p>
                        📅 Registered:
                        ${registration.registeredDate}
                    </p>

                    <button
                        class="cancel"
                        onclick="cancelRegistration(${index})">

                        Cancel Registration

                    </button>

                </div>

            `;

        }
    );

}


// Cancel registration

function cancelRegistration(index) {


    let registrations =
        JSON.parse(
            localStorage.getItem("registrations")
        ) || [];


    if (
        confirm(
            "Cancel this registration?"
        )
    ) {

        registrations.splice(index, 1);


        localStorage.setItem(
            "registrations",
            JSON.stringify(registrations)
        );


        displayRegistrations();

    }

}


// Load registrations

displayRegistrations();

</script>

</body>

</html>
