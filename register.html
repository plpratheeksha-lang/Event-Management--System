<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .event-name {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="form-box">

            <h1>📝 Event Registration</h1>

            <div class="event-name" id="eventName">
                Loading event...
            </div>

            <form id="registrationForm">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">
                    Complete Registration
                </button>

            </form>

            <a href="events.html" class="back">
                ← Back to Events
            </a>

        </div>

    </div>


    <script>

        // Get the event selected from events.html

        let selectedEvent =
            localStorage.getItem("selectedEvent");


        // Display event name

        if (selectedEvent) {

            document.getElementById("eventName").textContent =
                "Registering for: " + selectedEvent;

        } else {

            document.getElementById("eventName").textContent =
                "No event selected";

        }


        // Registration form

        document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            if (!selectedEvent) {

                alert("Please select an event first.");

                window.location.href = "events.html";

                return;
            }


            // Get entered details

            let name =
                document.getElementById("name").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let email =
                document.getElementById("email").value.trim();


            // Get previous registrations

            let registrations =
                JSON.parse(
                    localStorage.getItem("registrations")
                ) || [];


            // Create new registration

            let newRegistration = {

                id: Date.now(),

                event: selectedEvent,

                name: name,

                phone: phone,

                email: email,

                registeredDate:
                    new Date().toLocaleDateString()

            };


            // Add registration

            registrations.push(newRegistration);


            // Save registration

            localStorage.setItem(
                "registrations",
                JSON.stringify(registrations)
            );


            // Show success message

            alert(
                "Registration successful!\n\n" +
                "Event: " + selectedEvent +
                "\nName: " + name
            );


            // Open Dashboard

            window.location.href =
                "dashboard.html";

        });

    </script>

</body>

</html>
